services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: kb-qdrant
    ports:
      - "6333:6333"   # REST API + Web UI (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: kb-minio
    ports:
      - "9000:9000"   # S3 호환 API
      - "9001:9001"   # Web 콘솔 (http://localhost:9001)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # 프론트가 presigned URL로 PDF를 직접 받아간다. presigned URL 자체가 서명+만료로
      # 접근을 통제하므로 로컬 데모에선 origin을 열어둔다.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  qdrant_data:
  minio_data:
