
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: kb-qdrant
    ports:
      - "127.0.0.1:6333:6333"   # REST API + Web UI
      - "127.0.0.1:6334:6334"   # gRPC API
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY must be set in deploy/.env}
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: kb-minio
    ports:
      - "127.0.0.1:9000:9000"   # S3 호환 API
      - "127.0.0.1:9001:9001"   # Web 콘솔
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in deploy/.env}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  qdrant_data:
  minio_data:
